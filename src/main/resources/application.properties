spring.application.name=pulsepass

# ---------------------------------------------------------------------
# PostgreSQL (desarrollo local). Las pruebas NO usan estos valores:
# Testcontainers los sobrescribe en tiempo de ejecucion.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/pulsepass
spring.datasource.username=pulsepass
spring.datasource.password=pulsepass
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
# Flyway es el unico responsable del esquema (NFR-002 / seccion 13)
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------
# Hibernate solo valida: nunca crea ni actualiza tablas (QT-002)
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
