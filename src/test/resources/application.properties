# ---------------------------------------------------------------------
# Configuracion de pruebas.
# La URL/usuario/clave los inyecta Testcontainers en tiempo de ejecucion
# (ver AbstractPostgresIT). Aqui solo se fijan las reglas del taller.
# ---------------------------------------------------------------------

# QT-001: Flyway construye el esquema desde una base vacia
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# QT-002: Hibernate valida, no crea ni actualiza
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
logging.level.org.hibernate.SQL=info
