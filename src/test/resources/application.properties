# ---------------------------------------------------------------------
# Configuracion de pruebas.
# La URL/usuario/clave los inyecta Testcontainers en tiempo de ejecucion.
# ---------------------------------------------------------------------

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# QT-002: Hibernate valida, no crea ni actualiza
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
logging.level.org.hibernate.SQL=info

# Secreto exclusivo para pruebas automatizadas; nunca usar en produccion.
pulsepass.jwt.secret=PulsePass-test-only-secret-key-for-JWT-automated-tests-2026
pulsepass.jwt.issuer=pulsepass-test
pulsepass.jwt.expiration-seconds=900
